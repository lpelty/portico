## Generated by `bin/portico-gateway export-config-doc` from `gateway/portico_gateway/config_doc.py`; edit there, not here.
## Copy what you change into config.toml (the deployment's) or config.local.toml (a person's own).
## The reference, with when each change applies: CONFIGURATION.md.


## Which Claude Code settings the agent loads: `user`, `project` (the folder's CLAUDE.md, skills,
## hooks), `local`. Never empty: an empty list drops the folder's instructions and hooks.
# setting_sources = ["project"]
## A command (/bin/sh -c) run once per launch before the first engine starts.
## e.g. before_first_chat = "bin/prepare"  (not set by default)
## A command (/bin/sh -c) run on the way out, when the gateway stops.
## e.g. on_stop = "bin/cleanup"  (not set by default)
## How long a deployment command (before_first_chat, on_stop, restarts, update) may run. At least 1.
# command_timeout_seconds = 120
## Where a new session works when the person has not chosen a folder.
## e.g. default_folder = "~/work"  (not set by default)
## How long a permission card waits with no app attached before it is denied; 0 denies at once.
# card_hold_seconds = 600
## Events kept per chat so a reconnecting app catches up. At least 1.
# history_buffer = 2000
## `"single"`: one live session at a time, renewed; `"multiple"`: a list of chats.
# presentation = "single"
## The log step (Log session, /log, and a renewal first), sent as a message; unset means no log
## step.
## e.g. log_prompt = "/session-close"  (not set by default)
## Plug-in modules, imported at start.
# plugins = []
## Absolute folders put on the import path for the plug-ins (outside the checkout).
# plugin_paths = []
## A new session's mode: `"auto"` (the engine's classifier decides), `"acceptEdits"` (file edits
## allowed), `"default"` (ask each time).
# permission_mode = "auto"
## How often the [[services]] checks run. At least 5.
# services_interval_seconds = 30
## `"generated"`: after a session's first clean turn a small model names it; `"first_line"`: the
## first line of the first message, no extra model call.
# titles = "generated"
## The model for generated titles; unset is "haiku", the provider's small model.
## e.g. title_model = "my-small-model"  (not set by default)
## `"claude_code"` (or `"default"`): Claude Code's own prompt, which updates with Claude Code.
## `"custom"`: system_prompt_file's text is the whole prompt. `"none"` (legacy): the SDK's empty
## prompt. Portico's own lines always come last.
# system_prompt = "claude_code"
## The whole prompt, as an absolute path, required with system_prompt = "custom" and ignored
## otherwise. Read at each engine start. `bin/portico-gateway capture-prompt` makes a starting copy.
## e.g. system_prompt_file = "~/prompts/mine.md"  (not set by default)
## An absolute path to text added after the prompt, in any mode. Read at each engine start.
## e.g. system_prompt_append = "~/my-deployment/prompt.md"  (not set by default)
## The engine gets the person's login-shell PATH first, so it finds npx, node, uvx; false keeps the
## inherited PATH.
# login_shell_path = true

# [brand]
## The product name the app shows.
# name = "Portico"
## What the agent is called in the app.
# agent_name = "Agent"
## The accent colour, CSS hex.
## e.g. accent = "#3B6EF5"  (not set by default)
## An image for the mark; a flat square is rounded in the macOS icon shape.
## e.g. icon = "/path/to/icon.png"  (not set by default)
## An absolute path to an image that replaces the mark and name in the toolbar, 28 pt tall (SVG or
## PDF stays sharp).
## e.g. header_image = "/path/to/lockup.svg"  (not set by default)
## The deployment's version; the About panel shows it in place of the app's.
## e.g. version = "1.4.0"  (not set by default)
## The About panel's text under the version; {app_version} and {built} are filled in, "" shows
## nothing.
## e.g. about = "Questions: help@example.com"  (not set by default)
## A 1024×1024 PNG for the app bundle (bin/install); never sent to the app.
## e.g. app_icon = "~/icons/app.png"  (not set by default)
## A precompiled asset catalog (Assets.car) for the app bundle; with app_icon_name.
## e.g. app_icon_assets = "~/icons/Assets.car"  (not set by default)
## The icon's name inside app_icon_assets.
## e.g. app_icon_name = "AppIcon"  (not set by default)

# [update]
## A command that exits 0 and prints a version when an update is available; exit 1 or no output
## means none; any other exit is a failed check.
## e.g. check = "my-tool update --check"  (not set by default)
## A command that performs the update; the app's Update available runs it.
## e.g. run = "my-tool update"  (not set by default)

# [deployment]
## One command that restarts all the deployment's services (Restart all services).
## e.g. restart = "my-tool restart-all"  (not set by default)
## One command printing {"services": [...]} rows that replace the [[services]] checks.
## e.g. status = "my-tool status --json"  (not set by default)

## Buttons in the input bar; each sends its text.
# [[actions]]
#   label = "Review"    ## required
#   text = "/review"    ## required

## What the deployment depends on, shown in the app's services menu.
# [[services]]
#   id = "memory"    ## required
#   name = "Memory"    ## required
#   check = "curl -sf http://localhost:8888/health"    ## required
#   restart = "my-tool restart memory"    ## not set
#   up_detail = "recall and capture"    ## not set
#   timeout_seconds = 10    ## 10

## Folders the Files pane can browse.
# [[roots]]
#   name = "projects"    ## required
#   path = "~/projects"    ## required

# [sessions]
## A command whose output is the next session's number.
## e.g. next_number = "my-tool next-session"  (not set by default)
## True fixes "Works in" to the deployment's folder.
# lock_folder = false

# [threads]
## Threads open beside Main, 0 to 2; 0 turns threads off.
# max = 2

# [files]
## True lists only the [[roots]] in the Files pane, not the session's own folder.
# hide_session_folder = false

# [viewer]
## The default for Settings › Agent can see the viewer.
# agent_can_see = true
## The default for Settings › Agent checks HTML it creates.
# agent_checks_html = true
## Outside sites the agent may click and type on (bare host names; subdomains included).
# act_hosts = []
## How a Markdown page's Properties first open: `"folded"` or `"open"`.
# properties = "folded"

# [links]
## Host (or a parent domain) to the name a link chip shows.
# sites = {}

# [apps]
## MCP Apps: a tool's page shown in the chat; false keeps every tool a plain row.
# enabled = true

# [mcp]
## Servers in the folder's .mcp.json that are part of the deployment itself.
# core = []

# [spaces]
## A folder of pages the agent keeps current; must exist. Unset: <state dir>/spaces.
## e.g. folder = "~/Spaces"  (not set by default)
## A command run for Refresh, with $PORTICO_SPACE set.
## e.g. refresh = "my-tool refresh-space"  (not set by default)
## A command run after a space's file is moved to the Trash.
## e.g. remove = "my-tool forget-space"  (not set by default)
## A command for space-action: links, with $PORTICO_ACTION and $PORTICO_ITEM.
## e.g. act = "my-tool space-action"  (not set by default)
## A page is a space only with a folder of its name beside it.
# require_folder = false

# [person]
## The person's real name for comments; unset uses the computer's full user name.
## e.g. name = "Sam Rivera"  (not set by default)

# [voice]
## Read aloud on each reply: true shows the switch in Settings; the person's on/off choice stays in
## the app.
# read_aloud = false

# [signin.aws-sso]
## Regular expressions (case-insensitive) that make a failed turn an expired AWS sign-in. Unset:
## `cloud_credential_error`, "Could not load AWS credentials", "SSO session .* has expired",
## `ExpiredToken`, "security token included in the request is expired".
## e.g. patterns = ["cloud_credential_error"]  (not set by default)
## A command that exits 0 once the sign-in is current again, run every 10 s while a turn waits.
## Unset: the AWS SSO token cache (~/.aws/sso/cache), read every 5 s.
## e.g. check = "my-tool signed-in"  (not set by default)
## The command the card's Open sign-in page runs; its output's first URL and code show under Trouble
## signing in?. Unset: no button.
## e.g. open = "aws sso login --profile work"  (not set by default)
## The card's title. Unset: "Sign in again to continue".
## e.g. title = "Sign in again to continue"  (not set by default)
## The card's text. Unset: "Your sign-in to AWS has run out. Sign in in your browser; this
## conversation carries on by itself when you're done."
## e.g. body = "Your sign-in to AWS has run out."  (not set by default)
## The SSO start URL whose cached token counts as signed in again. Unset: any.
## e.g. sso_start_url = "https://example.awsapps.com/start"  (not set by default)
# [signin.claude]
## Regular expressions (case-insensitive), searched in the engine's own error message only, that
## make a failed turn an expired Claude sign-in; this kind applies only when the engine signs in
## with claude.ai (no CLAUDE_CODE_USE_BEDROCK or _VERTEX, no ANTHROPIC_API_KEY or
## ANTHROPIC_AUTH_TOKEN). Unset: `^authentication_failed$`, "Login expired", "OAuth token revoked",
## "OAuth token has expired", "Not logged in".
## e.g. patterns = ["^authentication_failed$"]  (not set by default)
## A command that exits 0 once the sign-in is current again, run every 10 s while a turn waits.
## Unset: `claude auth status` (signed in with claude.ai).
## e.g. check = "claude auth status"  (not set by default)
## The command the card's Open sign-in page runs; its URL shows under Trouble signing in?, with a
## field that pastes a code into it. Unset: `claude auth login`.
## e.g. open = "claude auth login"  (not set by default)
## The card's title. Unset: "Sign in again to continue".
## e.g. title = "Sign in again to continue"  (not set by default)
## The card's text. Unset: "Your Claude sign-in has run out. Sign in in your browser; this
## conversation carries on by itself when you're done."
## e.g. body = "Your Claude sign-in has run out."  (not set by default)
