[project]
name = "portico-gateway"
version = "0.7.0"
description = "Portico reference gateway: the agent side of the Portico app protocol"
authors = [
    { name = "Bill", email = "lpelty@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "pydantic>=2",
    "websockets>=17",
]

[project.scripts]
portico-gateway = "portico_gateway.__main__:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
